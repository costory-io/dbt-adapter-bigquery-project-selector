[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-bigquery-cost-optimization"
version = "0.1.0"
description = "dbt BigQuery adapter that routes the execution project by tag"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-bigquery>=1.11.0,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt*"]
namespaces = true

[tool.setuptools.package-data]
"dbt.include.bigquery_cost_optimization" = ["dbt_project.yml", "macros/*", "macros/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
